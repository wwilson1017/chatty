[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatty-cli"
dynamic = ["version"]
description = "Chat with your Chatty agents from a terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13", "prompt_toolkit>=3.0.30", "qrcode>=7.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chatty = "chatty_cli.main:main"

[tool.hatch.version]
path = "chatty_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["chatty_cli"]
