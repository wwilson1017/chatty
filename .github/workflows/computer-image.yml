name: Computer image

on:
  pull_request:
    paths:
      - 'computer/**'
      - '.github/workflows/computer-image.yml'
  push:
    branches: [master]
    paths:
      - 'computer/**'
      - '.github/workflows/computer-image.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: computer-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SMOKE_SECRET: smoke-test-secret-0123456789abcdef0123456789abcdef

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: computer
          load: true
          tags: chatty-computer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the computer
        run: |
          docker network create computer-net
          docker volume create computer-data
          docker run -d --name chatty-computer-test --network computer-net --shm-size=1g \
            -e COMPUTER_SECRET="$SMOKE_SECRET" \
            -p 127.0.0.1:8765:8080 -v computer-data:/data chatty-computer:test
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
      - name: Smoke test
        env:
          COMPUTER_URL: http://127.0.0.1:8765
          COMPUTER_SECRET: ${{ env.SMOKE_SECRET }}
          CONTAINER: chatty-computer-test
          IMAGE: chatty-computer:test
        run: python3 computer/smoke_test.py
      - name: Container logs
        if: always()
        run: docker logs chatty-computer-test 2>&1 | tail -300

  publish:
    name: Publish to GHCR
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: computer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wwilson1017/chatty-computer:latest
            ghcr.io/wwilson1017/chatty-computer:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
