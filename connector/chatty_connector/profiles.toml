# How chatty-connector runs each job. Chatty picks the mode (safe or full);
# what each mode is allowed to do on this machine is decided here, by you.
# {config_dir} expands to this file's directory.

max_concurrent = 1   # jobs at once, all runners
max_codex = 1        # of which Codex

[claude]
command = "claude"
safe = ["--permission-mode", "acceptEdits", "--settings", "{config_dir}/safe-settings.json"]
full = ["--dangerously-skip-permissions"]
timeout = { safe = 1800, full = 7200 }
resume = true

[codex]   # optional; delete this section if you don't use Codex
command = "codex"
safe = ["--sandbox", "workspace-write"]
full = ["--dangerously-bypass-approvals-and-sandbox"]
timeout = { safe = 1800, full = 7200 }
resume = false   # set true only if `codex exec resume <id>` works with your command
