[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatty-connector"
dynamic = ["version"]
description = "Runs your Chatty agents' Claude Code and Codex jobs on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chatty-connector = "chatty_connector.cli:main"

[tool.hatch.version]
path = "chatty_connector/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["chatty_connector"]
